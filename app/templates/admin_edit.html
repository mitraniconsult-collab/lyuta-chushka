{% extends "base.html" %}
{% block title %}Преглед — {{ config.SITE_NAME }}{% endblock %}
{% block content %}
<div class="admin page" style="max-width:860px">
  <p><a href="/admin" class="meta">← Към опашката</a></p>
  <h1>Преглед на материал</h1>
  <div class="panel">
    <span class="badge {{ 'red' if a.risk_level == 'high' else '' }}">риск: {{ a.risk_level }}</span>
    <span class="badge">{{ a.status }}</span>
    <p class="meta" style="margin:8px 0 0">{{ a.risk_reasons or 'без забележки от филтъра' }}</p>
  </div>
  <form method="post">
    <label>Заглавие</label>
    <input name="title" value="{{ a.title }}" required>
    <label>Резюме</label>
    <textarea name="summary" rows="2">{{ a.summary }}</textarea>
    <label>Текст (HTML: p, h2, blockquote)</label>
    <textarea name="body" rows="14" required>{{ a.body }}</textarea>
    <label>Рубрика</label>
    <select name="category">{% for slug, name in CATEGORIES.items() %}<option value="{{ slug }}" {{ 'selected' if slug == a.category else '' }}>{{ name }}</option>{% endfor %}</select>
    <label>Източници (Заглавие | https://адрес)</label>
    <textarea name="sources" rows="3">{{ a.sources }}</textarea>
    <label>Снимка (адрес, само със собствени или лицензирани права)</label>
    <input name="image_url" value="{{ a.image_url }}">
    <label>Автор / лиценз на снимката</label>
    <input name="image_credit" value="{{ a.image_credit }}">
    <div class="row" style="margin-top:20px">
      <button class="btn gray" name="action" value="save">Запази</button>
      <button class="btn" name="action" value="approve">Одобрявам и поемам отговорност</button>
      <button class="btn gray" name="action" value="reject">Отхвърли</button>
    </div>
  </form>
</div>
{% endblock %}
